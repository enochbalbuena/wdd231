<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thank You for Joining the Chamber of Commerce">
    <meta name="author" content="Enoch Balbuena">
    <meta property="og:title" content="Ocoyucan Chamber of Commerce - Home">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://enochbalbuena.github.io/wdd231/chamber/index.html">
    <meta property="og:image" content="https://enochbalbuena.github.io/wdd231/chamber/images/chamber-logo.png">
    <meta property="og:description" content="Join the Ocoyucan Chamber of Commerce and discover local businesses and events."> 
    <title>Thank You for Joining!</title>
    
    <link rel="icon" href="images/chamber-favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="images/chamber-logo.webp" alt="Ocoyucan Chamber of Commerce Logo" class="logo" width="50" height="50">
            <h1 class="site-name">Ocoyucan Chamber of Commerce</h1>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="discover.html">Discover</a></li>
                <li><a href="directory.html">Directory</a></li>
                <li><a href="join.html">Join</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="thank-you-section">
            <h2>Thank You for Joining the Chamber of Commerce!</h2>
            <p id="thank-you-message"></p>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentYear"></span> Ocoyucan Chamber of Commerce</p>
        <p id="lastModified"></p>
    </footer>

    <script>
        function getQueryParams() {
            const params = {};
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);

            for (const [key, value] of urlParams.entries()) {
                params[key] = value;
            }

            return params;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const params = getQueryParams();

            const message = `
                Thank you, <strong>${params['first-name']} ${params['last-name']}</strong>!<br>
                We have received your application with the following details:
                <ul>
                    <li>Email: ${params['email']}</li>
                    <li>Phone: ${params['phone']}</li>
                    <li>Business/Organization Name: ${params['organization']}</li>
                    <li>Submission Date: ${params['timestamp']}</li>
                </ul>
            `;

            document.getElementById('thank-you-message').innerHTML = message;

            const year = new Date().getFullYear();
            document.getElementById('currentYear').textContent = year;
            document.getElementById('lastModified').textContent = `Last Modified: ${document.lastModified}`;
        });
    </script>
</body>

</html>
